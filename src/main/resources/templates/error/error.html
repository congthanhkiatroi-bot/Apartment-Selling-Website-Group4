<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Error</title>
</head>

<body>

<h1>Something went wrong</h1>

<p>
    Status:
    <span th:text="${status}"></span>
</p>

<p>
    Error:
    <span th:text="${error}"></span>
</p>

<p>
    Message:
    <span th:text="${message}"></span>
</p>

<p>
    Path:
    <span th:text="${path}"></span>
</p>

<a th:href="@{/}">
    Back to Home
</a>

</body>
</html>
